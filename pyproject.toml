[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "python-rust-mock-architecture"
version = "0.1.0"
description = "A minimal Python package backed by a Rust extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "maturin>=1,<2",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.maturin]
python-source = "python"
module-name = "python_rust_mock_architecture._native"
features = ["extension-module"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
